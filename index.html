<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>SSVEP 実験選択</title>
  <style>
    body {
      margin: 0;
      background-color: black;
      color: white;
      font-family: sans-serif;
      text-align: center;
      overflow: hidden;
    }

    h1 {
      margin-top: 10%;
      font-size: 40px;
    }

    .menu-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      margin-top: 30px;
    }

    .menu-row {
      display: flex;
      gap: 20px;
    }

    .menu-button {
      padding: 20px 40px;
      font-size: 24px;
      background-color: #333;
      border: none;
      border-radius: 10px;
      color: white;
      cursor: pointer;
      min-width: 240px;
    }

    .menu-button:hover {
      background-color: #666;
    }

    #experiment-container {
      display: none;
    }

    .square {
      width: 300px;
      height: 300px;
      background-color: black;
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      border: 4px solid transparent;
      box-sizing: border-box;
      transition: border 0.1s;
    }

    /* ホバー時の装飾 */
    .square:hover {
      border: 4px solid #555;
    }

    /* RTFB用：注視対象の赤枠強調 */
    .square.highlight {
      border: 6px solid red !important;
    }

    #left {
      left: calc(50% - 400px);
    }

    #right {
      left: calc(50% + 100px);
    }

    #arrow {
      position: absolute;
      top: 50%;
      left: 50%;
      font-size: 100px;
      transform: translate(-50%, -50%);
      visibility: hidden;
    }

    #countdown {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 80px;
    }

    #restart-btn, #back-btn {
      position: absolute;
      top: 70%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 28px;
      background-color: #444;
      color: white;
      padding: 10px 30px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      visibility: hidden;
    }

    #back-btn {
      top: 80%;
    }

    #restart-btn:hover, #back-btn:hover {
      background-color: #666;
    }
  </style>
</head>
<body>
  <!-- === 実験選択画面 === -->
  <div id="menu">
    <h1>実験を選択してください</h1>
    <div class="menu-container">
      <div class="menu-row">
        <button class="menu-button" id="exp1-no-rtfb">実験1 (RTFBなし)</button>
        <button class="menu-button" id="exp1-rtfb">実験1 (RTFBあり)</button>
      </div>
      <div class="menu-row">
        <button class="menu-button" id="exp2-no-rtfb">実験2 (RTFBなし)</button>
        <button class="menu-button" id="exp2-rtfb">実験2 (RTFBあり)</button>
      </div>
    </div>
  </div>

  <!-- === 実験画面 === -->
  <div id="experiment-container">
    <div id="left" class="square"></div>
    <div id="right" class="square"></div>
    <div id="arrow"></div>
    <div id="countdown"></div>
    <button id="restart-btn">もう一度実験を行う</button>
    <button id="back-btn">実験選択に戻る</button>
  </div>

  <script>
    const menu = document.getElementById("menu");
    const container = document.getElementById("experiment-container");
    const left = document.getElementById("left");
    const right = document.getElementById("right");
    const arrow = document.getElementById("arrow");
    const countdown = document.getElementById("countdown");
    const restartBtn = document.getElementById("restart-btn");
    const backBtn = document.getElementById("back-btn");

    let currentExperiment = null; // 1 or 2
    let isRTFB = false;           // true or false

    // ===== 実験選択ボタン =====
    document.getElementById("exp1-no-rtfb").onclick = () => startExperiment(1, false);
    document.getElementById("exp1-rtfb").onclick    = () => startExperiment(1, true);
    document.getElementById("exp2-no-rtfb").onclick = () => startExperiment(2, false);
    document.getElementById("exp2-rtfb").onclick    = () => startExperiment(2, true);

    function startExperiment(expNum, rtfbStatus) {
      currentExperiment = expNum;
      isRTFB = rtfbStatus;
      menu.style.display = "none";
      container.style.display = "block";
      runExperiment();
    }

    // ハイライト（赤枠）の全解除関数
    function clearHighlights() {
      left.classList.remove("highlight");
      right.classList.remove("highlight");
    }

    // ===== 安静・カウントダウン共通関数 =====
    function rest(duration, label = "安静") {
      return new Promise(resolve => {
        clearHighlights();
        countdown.textContent = label;
        setTimeout(() => {
          countdown.textContent = "";
          resolve();
        }, duration);
      });
    }

    function showCountdown(seconds) {
      return new Promise(resolve => {
        clearHighlights();
        let count = seconds;
        countdown.textContent = count;
        const timer = setInterval(() => {
          count--;
          if (count > 0) countdown.textContent = count;
          else {
            clearInterval(timer);
            countdown.textContent = "";
            resolve();
          }
        }, 1000);
      });
    }

    // ===== 実験1：片側点滅 =====
    async function startFlicker(element, freq, duration, direction) {
      return new Promise(resolve => {
        let visible = true;
        const interval = 1000 / (freq * 2);
        arrow.textContent = direction === "left" ? "←" : "→";
        arrow.style.visibility = "visible";

        // RTFBありの場合、点滅中のターゲット要素を赤枠で囲む
        if (isRTFB) {
          element.classList.add("highlight");
        }

        const flickerInterval = setInterval(() => {
          element.style.backgroundColor = visible ? "white" : "black";
          visible = !visible;
        }, interval);

        setTimeout(() => {
          clearInterval(flickerInterval);
          element.style.backgroundColor = "black";
          arrow.style.visibility = "hidden";
          clearHighlights();
          resolve();
        }, duration);
      });
    }

    // ===== 実験2：同時点滅 =====
    async function startDualFlicker(leftFreq, rightFreq, duration, direction) {
      return new Promise(resolve => {
        let t0 = performance.now();
        arrow.textContent = direction === "left" ? "←" : "→";
        arrow.style.visibility = "visible";

        // RTFBありの場合、矢印が指している（注視すべき）刺激を赤枠で囲む
        if (isRTFB) {
          const targetEl = direction === "left" ? left : right;
          targetEl.classList.add("highlight");
        }

        function animate(timestamp) {
          const t = (timestamp - t0) / 1000;
          left.style.backgroundColor = Math.sin(2 * Math.PI * leftFreq * t) > 0 ? "white" : "black";
          right.style.backgroundColor = Math.sin(2 * Math.PI * rightFreq * t) > 0 ? "white" : "black";

          if (timestamp - t0 < duration) {
            requestAnimationFrame(animate);
          } else {
            left.style.backgroundColor = "black";
            right.style.backgroundColor = "black";
            arrow.style.visibility = "hidden";
            clearHighlights();
            resolve();
          }
        }
        requestAnimationFrame(animate);
      });
    }

    // ===== 実験実行 =====
    async function runExperiment() {
      restartBtn.style.visibility = "hidden";
      backBtn.style.visibility = "hidden";
      clearHighlights();

      await rest(5000);
      await showCountdown(5);

      if (currentExperiment === 1) {
        await startFlicker(left, 5, 5000, "left");
        await rest(3000);
        await startFlicker(right, 12, 5000, "right");
        await rest(3000);
        await startFlicker(left, 6, 5000, "left");
        await rest(3000);
        await startFlicker(right, 10, 5000, "right");
      } else if (currentExperiment === 2) {
        await startDualFlicker(5, 12, 5000, "left");
        await rest(3000);
        await startDualFlicker(5, 12, 5000, "right");
        await rest(5000);
        await showCountdown(5);
        await startDualFlicker(6, 10, 5000, "left");
        await rest(3000);
        await startDualFlicker(6, 10, 5000, "right");
      }

      countdown.textContent = "実験終了";
      restartBtn.style.visibility = "visible";
      backBtn.style.visibility = "visible";
    }

    restartBtn.onclick = () => {
      countdown.textContent = "";
      runExperiment();
    };

    backBtn.onclick = () => {
      container.style.display = "none";
      menu.style.display = "block";
      countdown.textContent = "";
      clearHighlights();
    };

    // ===== iPhone向けタッチ対応 =====
    [left, right].forEach(el => {
      el.addEventListener("touchstart", () => {
        if (!isRTFB) el.style.border = "4px solid red";
      });
      el.addEventListener("touchend", () => {
        if (!isRTFB) el.style.border = "4px solid transparent";
      });
    });
  </script>
</body>
</html>
